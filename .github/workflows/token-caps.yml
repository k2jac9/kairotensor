name: Evaluate output token caps
on:
  workflow_dispatch:
  push:
    branches: ['feat/token-preflight']
    paths:
      - 'scripts/handoff_model.py'
      - 'examples/corrected_handoff/adapter.rs'
      - 'examples/token_cap_eval.rs'
      - 'examples/token_cap_eval/**'
      - '.github/workflows/token-caps.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [unit, integration, package, migration, compatibility]
    env:
      FAMILY: ${{ matrix.family }}
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.48.3 accelerate==1.3.0 huggingface_hub==0.34.4 safetensors==0.5.3 'numpy<2'
      - name: Build cap experiment
        run: cargo build --release --example token_cap_eval
      - name: Run the sealed family
        run: |
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):'
          status=0
          target/release/examples/token_cap_eval --live --family "$FAMILY" --trace cap-trace.json || status=$?
          if [[ -s cap-trace.json ]]; then
            echo "CAP_TRACE_BEGIN"
            cat cap-trace.json
            echo
            echo "CAP_TRACE_END"
          fi
          exit "$status"
