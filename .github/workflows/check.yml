name: Check Kairotensor
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the Rust store, including the withdrawal example
        run: cargo test --all-targets
      - name: Run the revision and model handoff examples
        run: |
          cargo run --example withdrawal
          cargo run --example selective_revision
          cargo run --example corrected_handoff
          cargo run --example scoped_model_reuse
          cargo run --example scoped_model_reuse -- --replay-invalid
          cargo run --example token_cap_eval
      - name: Check the original reference contracts
        run: |
          python3 -m unittest discover -s reference -p test_memory.py
          python3 reference/belief_oracle.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify archived output-cap measurements
        run: python3 scripts/summarize_token_caps.py docs/evaluations/token-caps-*-2026-11-13.json
