name: Check Kairotensor
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAIROTENSOR_REQUIRE_LINUX_CLOCK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the Rust store, including the withdrawal example
        run: cargo test --locked --all-targets
      - name: Run the revision and model handoff examples
        run: |
          cargo run --locked --example withdrawal
          cargo run --locked --example deterministic_verdict
          cargo run --locked --example deadline_aware_recovery
          cargo run --locked --example runtime_recovery
          cargo run --locked --example selective_revision
          cargo run --locked --example corrected_handoff
          cargo run --locked --example scoped_model_reuse
          cargo run --locked --example scoped_model_reuse -- --replay-invalid
          cargo run --locked --example token_cap_eval
          cargo run --locked --example budgeted_recovery
      - name: Check the original reference contracts
        run: |
          python3 -m unittest discover -s reference -p test_memory.py
          python3 reference/belief_oracle.py
          cargo build --locked --example recovery_policy_eval
          KAIROTENSOR_RECOVERY_RUNNER="$PWD/target/debug/examples/recovery_policy_eval" python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify archived output-cap measurements
        run: python3 scripts/summarize_token_caps.py docs/evaluations/token-caps-*-2026-11-13.json

      - name: Verify synthetic recovery policy comparison
        run: python3 scripts/recovery_policy_eval.py --fixture
      - name: Collect and score Store-backed synthetic recovery trajectories
        run: |
          cargo run --locked --example recovery_policy_eval -- --trace "$RUNNER_TEMP/recovery-policy-trace.json"
          python3 scripts/recovery_policy_eval.py "$RUNNER_TEMP/recovery-policy-trace.json"
          KAIROTENSOR_RECOVERY_RUNNER="$PWD/target/debug/examples/recovery_policy_eval" python3 -m unittest discover -s scripts -p test_recovery_policy_runner.py
          KAIROTENSOR_RECOVERY_RUNNER="$PWD/target/debug/examples/recovery_policy_eval" python3 -m unittest discover -s scripts -p test_audit_recovery_bundle.py
      - name: Exercise bounded calibration without model inference
        run: python3 scripts/recovery_calibration.py --output "$RUNNER_TEMP/recovery-calibration.json"

      - name: Exercise offline timed runtime through the fixture Adapter
        run: cargo run --locked --example timed_recovery_runner -- --out "$RUNNER_TEMP/timed-recovery-runner"

      - name: Prepare frozen semantic calibration requests without inference
        run: python3 scripts/incident_routing.py prepare --out "$RUNNER_TEMP/incident-routing-calibration"

      - name: Verify all frozen incident request bytes through Store capture without inference
        run: |
          cargo run --locked --example incident_store_bridge -- --requests "$RUNNER_TEMP/incident-store-requests.json"
          python3 scripts/check_incident_store_bridge.py --requests "$RUNNER_TEMP/incident-store-requests.json"
          python3 -m unittest discover -s scripts -p test_incident_store_bridge.py

      - name: Emit bounded prepared-request calibration proposal without inference
        run: python3 scripts/incident_preflight.py --out "$RUNNER_TEMP/incident-preflight-plan.json"

      - name: Exercise bounded offline controller and durable accounting
        run: python3 scripts/incident_calibration_controller.py fixture --out "$RUNNER_TEMP/incident-controller-fixture"

      - name: Exercise prepared backend with fake dependencies only
        run: python3 scripts/incident_transformers_controller.py fixture --out "$RUNNER_TEMP/incident-transformers-fixture"
