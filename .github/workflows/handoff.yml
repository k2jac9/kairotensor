name: Evaluate corrected handoff
on:
  workflow_dispatch:
  push:
    branches: ['bench/corrected-handoff']
    paths:
      - 'examples/corrected_handoff.rs'
      - 'examples/corrected_handoff/**'
      - 'scripts/handoff_model.py'
      - '.github/workflows/handoff.yml'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the CPU model runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.48.3 accelerate==1.3.0 huggingface_hub==0.34.4 safetensors==0.5.3 'numpy<2'
      - name: Build example
        run: cargo build --release --example corrected_handoff
      - name: Evaluate synthetic handoff on CPU
        run: |
          status=0
          target/release/examples/corrected_handoff --live --trace handoff-trace.json || status=$?
          if [[ -s handoff-trace.json ]]; then
            echo "HANDOFF_TRACE_BEGIN"
            cat handoff-trace.json
            echo
            echo "HANDOFF_TRACE_END"
          fi
          exit "$status"
