name: Calibrate recovery runtime and output
on:
  push:
    branches: [feat/budgeted-recovery]
    paths: [.github/workflows/recovery-calibration.yml]
  workflow_dispatch:
    inputs:
      live:
        description: 'Run eight pinned CPU model calls (may consume billable Actions minutes)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  calibrate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.event.before == 'a1cbd67eddaf4a006ae528da915456a0339bc6f6' &&
       github.run_attempt == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Refuse an expired one-shot authorization
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$(date -u +%s)" -le "$(date -u -d '2026-11-14T08:50:00Z' +%s)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned runtime only for live calibration
        if: github.event_name == 'push' || inputs.live
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.48.3 accelerate==1.3.0 huggingface_hub==0.34.4 safetensors==0.5.3 jinja2==3.1.6 'numpy<2'
      - name: Record runner identity
        run: |
          mkdir -p calibration-run
          { git rev-parse HEAD; python --version; lscpu; free -b; } > calibration-run/environment.txt
      - name: Collect bounded calibration
        timeout-minutes: 25
        shell: bash
        env:
          LIVE: ${{ github.event_name == 'push' || inputs.live }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          limit=1500
          if [[ "$EVENT_NAME" == push ]]; then
            now=$(date -u +%s)
            test "$now" -le "$(date -u -d '2026-11-14T08:50:00Z' +%s)"
            remaining=$(( $(date -u -d '2026-11-14T09:25:00Z' +%s) - now ))
            if (( remaining < limit )); then limit=$remaining; fi
            test "$limit" -gt 0
          fi
          args=()
          if [[ "$LIVE" == true ]]; then args+=(--live); fi
          timeout --signal=TERM --kill-after=10s "${limit}s" python scripts/recovery_calibration.py --output calibration-run/result.json "${args[@]}" \
            2> >(tee calibration-run/stderr.log >&2) | tee calibration-run/stdout.log
      - name: Stage bounded artifacts
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import json, shutil
          source, target = Path('calibration-run'), Path('calibration-artifact')
          target.mkdir(exist_ok=True)
          remaining = 4 * 1024 * 1024
          entries = []
          for name in ('result.json', 'environment.txt', 'stderr.log', 'stdout.log'):
              path = source / name
              if not path.is_file() or path.is_symlink():
                  entries.append({'name': name, 'status': 'absent_or_not_regular'})
                  continue
              size = path.stat().st_size
              if size > remaining:
                  entries.append({'name': name, 'status': 'omitted_size_limit', 'bytes': size})
                  continue
              shutil.copyfile(path, target / name)
              remaining -= size
              entries.append({'name': name, 'status': 'copied', 'bytes': size})
          (target / 'manifest.json').write_text(json.dumps({'uncompressed_payload_limit': 4194304, 'files': entries}))
          PYCODE
      - name: Preserve complete or partial calibration
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: calibration-artifact/
          if-no-files-found: warn
          retention-days: 1
