[package]
name = "kairotensor"
version = "0.1.0"
edition = "2021"
description = "Versioned evidence memory for agent runtimes"
publish = false

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
