[package]
name = "kairotensor"
version = "0.1.0"
edition = "2021"
description = "Versioned evidence memory for agent runtimes"
publish = false

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.177"
